name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.5.0"
          node-version: "24"
          cache: true

      - name: Build
        run: vp pack

      - name: Publish to JSR
        run: pnpm dlx jsr publish --allow-slow-types

      - name: Publish to npm
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ "$VERSION" == *-* ]]; then
            TAG=$(echo "$VERSION" | sed 's/.*-\([^.]*\).*/\1/')
            pnpm publish --tag "$TAG"
          else
            pnpm publish
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release creation."
          else
            echo "Creating release for v$VERSION"
            gh release create "v$VERSION" --generate-notes
          fi
