name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version: "24.22.1"
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Check
        run: vp check

      - name: Run Tests
        run: vp run test

      - name: Build
        run: vp pack

      - name: Publish to JSR
        run: pnpm dlx jsr publish

      - name: Publish to npm
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ "$VERSION" == *-* ]]; then
            TAG=$(echo "$VERSION" | sed 's/.*-\([^.]*\).*/\1/')
            pnpm publish --tag "$TAG"
          else
            pnpm publish
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release creation."
          else
            echo "Creating release for v$VERSION"
            if [[ "$VERSION" == *-* ]]; then
              gh release create "v$VERSION" --generate-notes --prerelease
            else
              gh release create "v$VERSION" --generate-notes
            fi
          fi
