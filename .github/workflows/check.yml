name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Compare the PR merge commit with the base it merges into.
      # Any file outside the docs-only list counts as a code change.
      - name: Diff against base
        id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD \
            | grep -qvE '(\.md$|^skills/|^LICENSE$|^\.vscode/|^\.github/dependabot\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # "Check" is a required status check. A job skipped by `if` counts as
  # passing, so docs-only PRs can still merge.
  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - name: Run Check
        run: vp check

      - name: Run Tests
        run: vp run test

      - name: Run Build
        run: vp pack

      - name: Check JSR publish (slow types)
        run: pnpm dlx jsr publish --dry-run

      - name: Check for uncommitted changes
        run: git diff --exit-code
