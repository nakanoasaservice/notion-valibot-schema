name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.5.0"
          node-version: "24"
          cache: true

      - name: Run Check
        run: vp check

      - name: Run Tests
        run: vp run test

      - name: Run Build
        run: vp pack

      - name: Check for uncommitted changes
        run: git diff --exit-code
