catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  # Keep esbuild (optional peer of vite-plus-core) off versions with GHSA dev-server file read (<0.28.1).
  esbuild: ^0.28.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

pmOnFail: download
